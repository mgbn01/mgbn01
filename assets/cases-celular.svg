<svg xmlns="http://www.w3.org/2000/svg" width="420" height="986" viewBox="0 0 420 986" role="img" aria-label="Cases: Singular OS, No ar em português, com aprovação humana nas ações dos agentes; Equipe de IA, 10 funcionários de IA em 5 áreas da operação; Motion com IA, 1 aprovação: o roteiro; o resto o agente faz e confere; Kit de Produção, 5 etapas, do pedido à entrega com evidência">
<title>Cases: Singular OS, No ar em português, com aprovação humana nas ações dos agentes; Equipe de IA, 10 funcionários de IA em 5 áreas da operação; Motion com IA, 1 aprovação: o roteiro; o resto o agente faz e confere; Kit de Produção, 5 etapas, do pedido à entrega com evidência</title>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
